<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>메이플 플래닛 장비 시세</title>
<style>
  :root { color-scheme: light dark; --bd: #8883; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0 auto; padding: 1rem; max-width: 48rem; }
  h1 { font-size: 1.1rem; margin: 0 0 .75rem; }
  #bar { display: flex; gap: .5rem; margin-bottom: 1rem; }
  input, button { font: inherit; padding: .4rem .7rem; border: 1px solid var(--bd); border-radius: 6px; background: transparent; color: inherit; }
  input { flex: 1; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { border-bottom: 1px solid var(--bd); }
  li button { width: 100%; text-align: left; border: none; padding: .6rem .2rem; cursor: pointer; }
  #detail { margin-top: 1rem; }
  .trade { display: flex; gap: .6rem; padding: .4rem 0; border-bottom: 1px solid var(--bd); font-size: .9rem; }
  .trade .price { font-weight: 600; font-variant-numeric: tabular-nums; }
  .grade { padding: .05rem .4rem; border-radius: 4px; background: #8883; font-size: .8rem; }
  .potential { opacity: .75; font-size: .85rem; }
  .empty { opacity: .6; padding: 1rem 0; }
</style>

<h1>📦 메이플 플래닛 장비 시세</h1>

<div id="bar">
  <input id="q" placeholder="아이템 이름 (예: 검은색 허리띠)">
  <button id="go">검색</button>
</div>

<ul id="list"></ul>
<div id="detail"></div>

<script>
const qEl = document.getElementById('q')
const listEl = document.getElementById('list')
const detailEl = document.getElementById('detail')

async function doSearch() {
  const q = qEl.value.trim()
  detailEl.replaceChildren()
  const r = await fetch(`/api/search?q=${encodeURIComponent(q)}`).then(r => r.json())
  if (!r.names.length) {
    listEl.replaceChildren(Object.assign(document.createElement('li'), { className: 'empty', textContent: '검색 결과가 없습니다.' }))
    return
  }
  listEl.replaceChildren(...r.names.map(name => {
    const li = document.createElement('li')
    const btn = document.createElement('button')
    btn.textContent = name
    btn.onclick = () => showItem(name)
    li.append(btn)
    return li
  }))
}

async function showItem(name) {
  const doc = await fetch(`/api/items/${encodeURIComponent(name)}`).then(r => r.json())
  if (doc.error) { detailEl.textContent = '불러오지 못했습니다.'; return }
  const stats = Object.entries(doc.baseStats).map(([k, v]) => `${k} ${v}`).join(' · ')
  const trades = doc.trades.map(t => {
    const row = document.createElement('div')
    row.className = 'trade'
    row.innerHTML =
      `<span class="grade">${t.grade ?? '?'}</span>` +
      `<span class="price">${t.price.toLocaleString()} 메소</span>` +
      `<span class="potential">${t.potential.join(' · ')}</span>` +
      `<span style="margin-left:auto;opacity:.6">${t.tradedAt ?? ''}</span>`
    return row
  })
  detailEl.replaceChildren(
    Object.assign(document.createElement('h2'), { style: 'font-size:1rem', textContent: `${doc.name} (Lv.${doc.reqLevel ?? '?'} · ${doc.equipSlot ?? '?'})` }),
    Object.assign(document.createElement('div'), { style: 'opacity:.7;margin-bottom:.5rem', textContent: stats }),
    ...trades,
  )
}

document.getElementById('go').onclick = doSearch
qEl.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch() })
doSearch()
</script>
