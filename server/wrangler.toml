name = "maple-tools"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# routes를 쓰면 workers_dev가 자동으로 false가 되어 *.workers.dev가 404를 낸다.
# 최상위에 둬야 한다 — [vars] 뒤에 쓰면 TOML이 그 섹션의 키로 읽어 그냥 변수가 된다.
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "maple-tools"
database_id = ""   # `npx wrangler d1 create maple-tools` 실행 후 나오는 값으로 채운다

# 보관 기간 정리를 매일 한 번 돌린다.
[triggers]
crons = ["0 20 * * *"]

[[rules]]
type = "Text"
globs = ["**/*.html"]
